<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>夜航音乐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#060712;--panel:rgba(11,14,29,.46);--panel-strong:rgba(9,12,25,.72);
  --card:rgba(255,255,255,.06);--card-strong:rgba(255,255,255,.11);
  --border:rgba(255,255,255,.12);--text:#f4f6ff;--muted:#b0b7d7;
  --accent:#8f7cff;--accent2:#3d6bff;--accent3:#6ed1ff;--danger:#ff6b82;
  --shadow:0 22px 60px rgba(0,0,0,.42);--radius:24px;--radius-full:999px;
  --player-h:96px;
}
html,body{
  height:100%;overflow:hidden;background:
  radial-gradient(circle at top,rgba(81,100,255,.22),transparent 34%),
  radial-gradient(circle at 80% 20%,rgba(154,89,255,.18),transparent 26%),
  linear-gradient(180deg,#0b0d17 0%,#05060c 100%);
  color:var(--text);font-family:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(8,10,20,.18) 0%,rgba(4,5,10,.44) 54%,rgba(2,3,8,.82) 100%);
  z-index:1
}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:999px}

.app{
  position:relative;height:100vh;overflow:hidden;isolation:isolate;
  padding:18px clamp(16px,3vw,32px) 0
}
.bg-layer{
  position:absolute;inset:0;overflow:hidden;z-index:0;
  background:
    radial-gradient(circle at 16% 18%,rgba(85,117,255,.30),transparent 24%),
    radial-gradient(circle at 82% 20%,rgba(162,94,255,.24),transparent 28%),
    linear-gradient(160deg,#11162a 0%,#090b15 38%,#04050a 100%)
}
#now-cover{
  position:absolute;inset:-8%;width:116%;height:116%;object-fit:cover;
  filter:blur(30px) saturate(1.05) brightness(.36);
  transform:scale(1.08);opacity:.9;transition:opacity .7s ease,filter .7s ease,transform 1.4s ease;
  animation:coverFloat 18s ease-in-out infinite alternate
}
#now-def-icon{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.08);font-size:clamp(88px,18vw,180px);letter-spacing:.12em;
  background:
    radial-gradient(circle at center,rgba(123,96,255,.30),transparent 26%),
    radial-gradient(circle at 50% 40%,rgba(88,127,255,.20),transparent 34%)
}
.bg-shade,.bg-vignette{
  position:absolute;inset:0;pointer-events:none
}
.bg-shade{
  background:
    linear-gradient(180deg,rgba(4,6,14,.22) 0%,rgba(7,10,24,.34) 26%,rgba(6,8,18,.52) 48%,rgba(5,6,14,.84) 100%),
    linear-gradient(90deg,rgba(3,4,8,.36) 0%,transparent 32%,transparent 68%,rgba(3,4,8,.36) 100%)
}
.bg-vignette{
  background:radial-gradient(circle at center,transparent 42%,rgba(0,0,0,.34) 100%)
}

.header,.hero,.content,.player-bar{position:relative;z-index:2}
.header{
  width:min(1180px,100%);margin:0 auto;
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px
}
.header .brand{
  cursor:pointer;display:flex;flex-direction:column;gap:4px;max-width:80%
}
.header .brand strong{
  font-size:clamp(18px,2vw,22px);font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  color:#eef1ff;text-shadow:0 10px 30px rgba(0,0,0,.25)
}
.header .brand span{
  font-size:12px;letter-spacing:.12em;color:rgba(236,240,255,.72);text-transform:uppercase
}
.header .actions{display:flex;gap:10px}
.header .actions button{
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);
  color:var(--text);width:42px;height:42px;border-radius:50%;cursor:pointer;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 8px 20px rgba(0,0,0,.20);transition:transform .18s ease,background .18s ease,border-color .18s ease
}
.header .actions button:hover,.header .actions button:active{
  transform:translateY(-1px);background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.26)
}

.hero{
  width:min(1180px,100%);margin:0 auto;
  min-height:clamp(220px,36vh,380px);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:18px 12px 26px
}
.hero-copy{
  display:flex;flex-direction:column;align-items:center;gap:12px;
  max-width:min(760px,90vw)
}
.hero-kicker{
  display:inline-flex;align-items:center;gap:10px;padding:8px 14px;border-radius:var(--radius-full);
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:rgba(243,246,255,.84)
}
.hero-kicker::before,.hero-kicker::after{
  content:'';width:18px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent)
}
#now-name{
  font-size:clamp(36px,7vw,78px);line-height:.96;font-weight:900;letter-spacing:-.04em;
  text-shadow:0 16px 32px rgba(0,0,0,.36)
}
#now-meta{
  font-size:clamp(15px,2vw,24px);line-height:1.35;color:rgba(234,239,255,.82);
  text-shadow:0 10px 30px rgba(0,0,0,.34)
}

.content{
  height:calc(100vh - clamp(318px,52vh,486px));
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  width:min(1180px,100%);margin:0 auto;
  padding:0 0 calc(var(--player-h) + 26px)
}
.tab-page{
  display:none;min-height:100%;
  background:linear-gradient(180deg,rgba(12,16,30,.60),rgba(8,11,22,.84));
  border:1px solid rgba(255,255,255,.12);border-radius:32px;
  box-shadow:var(--shadow);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  overflow:hidden
}
.tab-page.active{display:block;animation:panelFade .45s ease}

.library-header{
  position:sticky;top:0;z-index:4;padding:24px 24px 16px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  background:linear-gradient(180deg,rgba(10,13,27,.88),rgba(10,13,27,.56) 72%,transparent 100%);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)
}
.library-header h2{
  font-size:clamp(24px,3vw,36px);font-weight:800;letter-spacing:-.03em
}
.library-header .count{font-size:13px;color:rgba(235,239,255,.68);white-space:nowrap}
.library-grid{padding:4px 18px 22px;display:flex;flex-direction:column;gap:12px}
.library-item{
  position:relative;display:flex;align-items:center;gap:16px;padding:16px 18px;
  border-radius:26px;border:1px solid rgba(255,255,255,.08);
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));
  cursor:pointer;transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease
}
.library-item:hover,.library-item:active{
  transform:translateY(-1px);background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.05));
  border-color:rgba(255,255,255,.16)
}
.library-item.playing{
  border-color:rgba(145,133,255,.46);
  box-shadow:0 20px 34px rgba(62,79,196,.20),inset 0 0 0 1px rgba(145,133,255,.16);
  background:linear-gradient(180deg,rgba(101,88,255,.22),rgba(255,255,255,.06))
}
.library-item .thumb{
  position:relative;width:58px;height:58px;border-radius:50%;overflow:hidden;flex-shrink:0;
  background:
    radial-gradient(circle at 30% 30%,rgba(145,124,255,.95),rgba(66,85,216,.85) 52%,rgba(15,19,39,.92) 100%);
  box-shadow:0 14px 28px rgba(0,0,0,.24)
}
.library-item .thumb::after{
  content:'';position:absolute;inset:0;border-radius:inherit;
  border:1px solid rgba(255,255,255,.16);pointer-events:none
}
.library-item .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.library-item .thumb .def-icon{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:20px;color:rgba(255,255,255,.7)
}
.library-item .info{flex:1;min-width:0}
.library-item .info .name{
  font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.library-item .info .artist{
  margin-top:5px;font-size:13px;color:rgba(232,236,255,.64);white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.library-item .info .artist:empty{display:none}
.library-item .play-btn,.library-item .delete-btn{
  display:flex;align-items:center;justify-content:center;flex-shrink:0;border:none;cursor:pointer;
  transition:transform .18s ease,opacity .18s ease,background .18s ease
}
.library-item .play-btn{
  width:42px;height:42px;border-radius:50%;
  background:linear-gradient(180deg,#fbfdff,#c9d4ff);color:#161b32;font-size:15px;
  box-shadow:0 12px 24px rgba(0,0,0,.22)
}
.library-item .play-btn:active{transform:scale(.94)}
.library-item .delete-btn{
  width:30px;height:30px;border-radius:50%;background:rgba(255,107,130,.18);
  color:#ffd9e0;font-size:12px;opacity:.72;border:1px solid rgba(255,107,130,.28)
}
.library-item .delete-btn:hover,.library-item .delete-btn:active{
  opacity:1;transform:scale(.96);background:rgba(255,107,130,.24)
}

.empty-state{
  text-align:center;padding:68px 24px;color:rgba(235,239,255,.66)
}
.empty-state .big-icon{
  font-size:54px;margin-bottom:14px;opacity:.42
}
.empty-state p{font-size:15px;line-height:1.65}
.empty-state .sub{font-size:12px;margin-top:6px;opacity:.72;letter-spacing:.08em}

.search-bar{
  position:sticky;top:0;z-index:4;margin:0;padding:22px 22px 18px;
  display:flex;align-items:center;gap:12px;
  background:linear-gradient(180deg,rgba(10,13,27,.90),rgba(10,13,27,.60) 72%,transparent 100%);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)
}
.search-bar .icon{
  width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);font-size:16px;color:#eef2ff
}
.search-bar input{
  flex:1;min-width:0;height:54px;padding:0 18px;border-radius:var(--radius-full);
  border:1px solid rgba(255,255,255,.12);outline:none;background:rgba(255,255,255,.08);
  color:var(--text);font-size:15px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)
}
.search-bar input::placeholder{color:rgba(232,236,255,.48)}
.search-bar .clear{
  width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.08);color:rgba(235,239,255,.78);font-size:14px;cursor:pointer;
  display:none;align-items:center;justify-content:center
}
.search-bar .clear.show{display:flex}

.search-results{
  padding:0 22px 22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px
}
.search-results>.empty-state,.search-results>.loading{grid-column:1/-1}
.search-card{
  position:relative;overflow:hidden;cursor:pointer;border-radius:28px;
  border:1px solid rgba(255,255,255,.10);
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));
  box-shadow:0 20px 38px rgba(0,0,0,.22);transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease
}
.search-card:hover,.search-card:active{
  transform:translateY(-2px);border-color:rgba(255,255,255,.18);box-shadow:0 26px 44px rgba(0,0,0,.26)
}
.search-card.playing{
  border-color:rgba(145,133,255,.44);box-shadow:0 26px 46px rgba(79,96,221,.22)
}
.search-card .cover-wrap{
  position:relative;width:100%;aspect-ratio:1;overflow:hidden;
  background:
    radial-gradient(circle at 30% 30%,rgba(145,124,255,.95),rgba(66,85,216,.85) 48%,rgba(15,19,39,.92) 100%)
}
.search-card .cover-wrap img{
  width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.1s ease,filter .35s ease
}
.search-card:hover .cover-wrap img{transform:scale(1.04)}
.search-card .cover-wrap .overlay{
  position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 35%,rgba(7,9,18,.16) 62%,rgba(4,6,12,.72) 100%)
}
.search-card .info{padding:14px 16px 16px}
.search-card .info .name{
  font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.search-card .info .meta{
  margin-top:6px;font-size:12px;color:rgba(232,236,255,.64);white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.search-card .play-overlay{
  position:absolute;right:14px;bottom:14px;width:46px;height:46px;border-radius:50%;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.14);color:var(--text);font-size:16px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 12px 24px rgba(0,0,0,.22);transition:transform .18s ease,background .18s ease
}
.search-card .play-overlay:active{transform:scale(.94)}

.player-bar{
  position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
  width:min(720px,calc(100vw - 24px));min-height:var(--player-h);
  padding:18px 22px 16px;border-radius:30px;
  background:linear-gradient(180deg,rgba(16,20,37,.56),rgba(10,13,25,.84));
  border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(30px) saturate(1.1);-webkit-backdrop-filter:blur(30px) saturate(1.1);
  box-shadow:0 28px 60px rgba(0,0,0,.34)
}
.progress-tick{
  position:absolute;top:0;left:20px;right:20px;height:3px;overflow:hidden;
  background:rgba(255,255,255,.08);border-radius:999px
}
.progress-tick .fill{
  height:100%;width:0%;border-radius:999px;
  background:linear-gradient(90deg,var(--accent3),var(--accent),#c178ff);
  box-shadow:0 0 18px rgba(110,209,255,.35);transition:width .45s linear
}
.player-bar .ctrls{
  display:flex;align-items:center;justify-content:center;gap:14px
}
.player-bar .ctrls button{
  width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.08);color:var(--text);font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  transition:transform .18s ease,background .18s ease,border-color .18s ease
}
.player-bar .ctrls button:hover,.player-bar .ctrls button:active{
  transform:translateY(-1px);background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.20)
}
.player-bar .ctrls .mode-btn{
  width:46px;height:46px;font-size:17px;color:rgba(235,239,255,.84)
}
.player-bar .ctrls .play-main{
  width:68px;height:68px;font-size:28px;color:#0e1226;border:none;
  background:linear-gradient(180deg,#ffffff,#c5d0ff 55%,#9ab0ff 100%);
  box-shadow:0 16px 28px rgba(0,0,0,.26),0 0 0 10px rgba(255,255,255,.05)
}

.loading{text-align:center;padding:34px 24px;color:rgba(235,239,255,.70);font-size:14px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading.spin::before{
  content:'';display:inline-block;width:18px;height:18px;margin-right:10px;vertical-align:-4px;
  border:2px solid rgba(255,255,255,.18);border-top-color:var(--accent3);border-radius:50%;
  animation:spin .65s linear infinite
}
@keyframes coverFloat{
  from{transform:scale(1.08) translate3d(-1.5%,0,0)}
  to{transform:scale(1.13) translate3d(1.5%,-1%,0)}
}
@keyframes panelFade{
  from{opacity:0;transform:translateY(18px)}
  to{opacity:1;transform:translateY(0)}
}
@media(max-width:720px){
  .app{padding:14px 12px 0}
  .hero{min-height:clamp(220px,34vh,300px);padding:18px 8px 22px}
  .content{height:calc(100vh - 300px)}
  .library-header,.search-bar{padding-left:16px;padding-right:16px}
  .library-grid,.search-results{padding-left:14px;padding-right:14px}
  .search-results{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .player-bar{padding:16px 16px 14px}
  .player-bar .ctrls{gap:10px}
  .player-bar .ctrls button{width:46px;height:46px;font-size:18px}
  .player-bar .ctrls .play-main{width:60px;height:60px;font-size:24px}
}
</style>
</head>
<body>

<div class="app">
  <div class="bg-layer">
    <img id="now-cover" src="" alt="" onerror="this.style.display='none'">
    <div class="def-icon" id="now-def-icon">♫</div>
    <div class="bg-shade"></div>
    <div class="bg-vignette"></div>
  </div>

  <div class="header">
    <div class="brand">
      <strong>Night Flight</strong>
      <span>夜航音乐 · 点标题切换曲库 / 搜索</span>
    </div>
    <div class="actions">
      <button id="btn-refresh" title="刷新曲库">⟳</button>
    </div>
  </div>

  <div class="hero">
    <div class="hero-copy" id="player-info">
      <div class="hero-kicker">Now Playing</div>
      <div class="name" id="now-name">夜航音乐</div>
      <div class="meta" id="now-meta">选择一首歌开始</div>
    </div>
  </div>

  <div class="content" id="content">
    <div class="tab-page active" id="page-library">
      <div class="library-header">
        <h2>离线曲库</h2>
        <span class="count" id="lib-count">0 首</span>
      </div>
      <div class="library-grid" id="library-list"></div>
    </div>

    <div class="tab-page" id="page-search">
      <div class="search-bar">
        <span class="icon">🔎</span>
        <input id="search-input" type="text" placeholder="搜歌曲、歌手..." autocomplete="off">
        <button class="clear" id="search-clear">✕</button>
      </div>
      <div class="search-results" id="search-results"></div>
    </div>
  </div>

  <div class="player-bar" id="player-bar" style="display:none">
    <div class="progress-tick"><div class="fill" id="progress-fill"></div></div>
    <div class="ctrls">
      <button class="mode-btn" id="btn-mode" title="播放模式">🔁</button>
      <button id="btn-prev" title="上一首">⏮</button>
      <button class="play-main" id="btn-play" title="播放/暂停">▶</button>
      <button id="btn-next" title="下一首">⏭</button>
    </div>
  </div>
</div>

<audio id="audio" preload="auto"></audio>

<script>
// ===== 状态 =====
const state = {
  tab: 'library',
  library: [],
  searchResults: [],
  playQueue: [],      // 当前播放队列
  queueIndex: -1,     // 当前在队列中的位置
  nowPlaying: null,
  isPlaying: false,
  playMode: 0,        // 0=顺序, 1=随机, 2=单曲循环
  isLocalPlay: false  // true=播本地曲库, false=播流媒体
}
const MODE_LABELS = ['🔁 顺序播放','🔀 随机播放','🔂 单曲循环']
const MODE_ICONS  = ['🔁','🔀','🔂']
const audio = document.getElementById('audio')
const $ = id => document.getElementById(id)

// ===== 工具 =====
function fmtTime(s){
  if(!s||isNaN(s)||!isFinite(s)) return '00:00'
  const m=Math.floor(s/60), sec=Math.floor(s%60)
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')
}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

// ===== API =====
async function api(path){
  const r=await fetch(path)
  if(!r.ok) throw new Error(r.statusText)
  return r.json()
}

// ===== 页面切换 =====
function switchTab(tab){
  state.tab=tab
  document.querySelectorAll('.tab-page').forEach(p=>p.classList.toggle('active',p.id==='page-'+tab))
  if(tab==='library') loadLibrary()
}

// 头部点击切tab
document.querySelector('.header .brand').addEventListener('click',()=>{
  switchTab(state.tab==='library'?'search':'library')
})

// ===== 曲库 =====
async function loadLibrary(){
  try{
    const data=await api('/api/library')
    state.library=data.songs||[]
    renderLibrary()
  }catch(e){$('library-list').innerHTML='<div class="empty-state"><p style="color:var(--danger)">加载失败</p></div>'}
}

function renderLibrary(){
  const el=$('library-list'), cnt=$('lib-count')
  if(!state.library.length){
    el.innerHTML='<div class="empty-state"><div class="big-icon">📚</div><p>离线曲库还没有歌曲</p><p class="sub">去搜索页搜索并下载吧</p></div>'
    cnt.textContent='0 首'
    return
  }
  cnt.textContent=state.library.length+' 首'
  el.innerHTML=state.library.map((s,i)=>{
    const isPlaying=state.nowPlaying&&state.nowPlaying.file===s.file&&state.isLocalPlay
    return '<div class="library-item'+(isPlaying?' playing':'')+'" data-idx="'+i+'">'+
      '<div class="thumb">'+
        (s.cover?'<img src="'+esc(s.cover)+'" alt="" onerror="this.style.display=\'none\'" loading="lazy">':'')+
        '<div class="def-icon"'+(s.cover?' style="display:none"':'')+'>🎵</div>'+
      '</div>'+
      '<div class="info">'+
        '<div class="name">'+esc(s.name)+'</div>'+
        '<div class="artist">'+esc(s.artist)+'</div>'+
      '</div>'+
      '<button class="play-btn" data-idx="'+i+'">'+(isPlaying?'⏸':'▶')+'</button>'+
      '<button class="delete-btn" data-idx="'+i+'" title="删除">✕</button>'+
    '</div>'
  }).join('')

  // 播放/删除事件
  el.querySelectorAll('.library-item').forEach(item=>{
    item.addEventListener('click',(e)=>{
      if(e.target.closest('.delete-btn')||e.target.closest('.play-btn')) return
      const idx=parseInt(item.dataset.idx)
      playLibrary(idx)
    })
  })
  el.querySelectorAll('.play-btn').forEach(btn=>{
    btn.addEventListener('click',(e)=>{
      e.stopPropagation()
      const idx=parseInt(btn.dataset.idx)
      const song=state.library[idx]
      if(state.nowPlaying&&state.nowPlaying.file===song.file&&state.isLocalPlay){
        togglePlay()
      }else{
        playLibrary(idx)
      }
    })
  })
  el.querySelectorAll('.delete-btn').forEach(btn=>{
    btn.addEventListener('click',async (e)=>{
      e.stopPropagation()
      if(!confirm('删除这首歌曲？')) return
      const idx=parseInt(btn.dataset.idx)
      const song=state.library[idx]
      try{
        await fetch('/api/library/'+encodeURIComponent(song.file),{method:'DELETE'})
        loadLibrary()
      }catch(err){alert('删除失败')}
    })
  })
}

function playLibrary(idx){
  const song=state.library[idx]
  if(!song||!song.path) return
  state.isLocalPlay=true
  state.playQueue=state.library
  state.queueIndex=idx
  state.nowPlaying=song
  playLocal(song)
}

function playLocal(song){
  $('player-bar').style.display='flex'
  $('now-name').textContent=song.name||'未知'
  $('now-meta').textContent=song.artist||'离线曲库'
  updateCover(song.cover||'')
  updatePlayBtn(true)
  audio.src=song.path
  audio.play().then(()=>{
    state.isPlaying=true
    $('btn-play').textContent='⏸'
  }).catch(()=>{})
  renderLibrary()
}

// ===== 流式搜索播放 =====
async function playSearch(idx){
  const song=state.searchResults[idx]
  if(!song||!song.id) return
  state.isLocalPlay=false
  state.playQueue=state.searchResults
  state.queueIndex=idx
  state.nowPlaying=song
  playStream(song)
  // 后台下载
  try{
    await fetch('/api/download',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        keyword: song.name+' '+(song.artist||''),
        song: {id:song.id,name:song.name,artist:song.artist,cover:song.cover||'',duration:song.duration||0}
      })
    })
  }catch(_){}
}

function playStream(song){
  if(!song||!song.id) return
  const url='/api/stream?videoId='+encodeURIComponent(song.id)+'&title='+encodeURIComponent(song.name||'')
  $('player-bar').style.display='flex'
  $('now-name').textContent=song.name||'未知'
  $('now-meta').textContent=(song.artist||'YouTube')+' · 在线'
  updateCover(song.cover||'')
  updatePlayBtn(true)
  audio.src=url
  audio.play().then(()=>{
    state.isPlaying=true
    $('btn-play').textContent='⏸'
  }).catch(()=>{})
  // 高亮搜索项
  highlightSearch(idx=>song.id===state.searchResults[idx]?.id)
}

function updateCover(url){
  const img=$('now-cover'), def=$('now-def-icon')
  if(url){img.src=url;img.style.display='';def.style.display='none'}
  else{img.style.display='none';def.style.display='flex'}
}

function updatePlayBtn(isPlay){
  $('btn-play').textContent=isPlay?'⏸':'▶'
}

// ===== 搜索 =====
let searchTimer=null
$('search-input').addEventListener('input',()=>{
  clearTimeout(searchTimer)
  const q=$('search-input').value.trim()
  $('search-clear').classList.toggle('show',!!q)
  if(!q){$('search-results').innerHTML='';return}
  searchTimer=setTimeout(()=>doSearch(q),400)
})
$('search-clear').addEventListener('click',()=>{
  $('search-input').value='';$('search-results').innerHTML=''
  $('search-clear').classList.remove('show')
  $('search-input').focus()
})
$('search-input').addEventListener('keydown',e=>{if(e.key==='Enter'){const q=$('search-input').value.trim();if(q)doSearch(q)}})

async function doSearch(q){
  $('search-results').innerHTML='<div class="loading spin">搜索中...</div>'
  try{
    const data=await api('/api/search?q='+encodeURIComponent(q))
    state.searchResults=data.songs||[]
    renderSearch()
  }catch(e){
    $('search-results').innerHTML='<div class="empty-state"><p style="color:var(--danger)">搜索失败: '+esc(e.message)+'</p></div>'
  }
}

function renderSearch(){
  const el=$('search-results')
  if(!state.searchResults.length){
    el.innerHTML='<div class="empty-state" style="grid-column:1/-1"><div class="big-icon">🎵</div><p>没有找到结果</p></div>'
    return
  }
  el.innerHTML=state.searchResults.map((s,i)=>{
    const isPlaying=state.nowPlaying&&!state.isLocalPlay&&state.nowPlaying.id===s.id
    return '<div class="search-card'+(isPlaying?' playing':'')+'" data-idx="'+i+'">'+
      '<div class="cover-wrap">'+
        (s.cover?'<img src="'+esc(s.cover)+'" alt="" onerror="this.style.display=\'none\'" loading="lazy">':'')+
        '<div class="overlay"></div>'+
        '<button class="play-overlay" data-idx="'+i+'">'+(isPlaying?'⏸':'▶')+'</button>'+
      '</div>'+
      '<div class="info">'+
        '<div class="name">'+esc(s.name)+'</div>'+
        '<div class="meta">'+esc(s.artist||'')+' · '+fmtTime(s.duration)+'</div>'+
      '</div>'+
    '</div>'
  }).join('')

  el.querySelectorAll('.search-card').forEach(card=>{
    card.addEventListener('click',(e)=>{
      if(e.target.closest('.play-overlay')) return
      const idx=parseInt(card.dataset.idx)
      const song=state.searchResults[idx]
      if(state.nowPlaying&&!state.isLocalPlay&&state.nowPlaying.id===song.id){
        togglePlay()
      }else{
        playSearch(idx)
      }
    })
  })
  el.querySelectorAll('.play-overlay').forEach(btn=>{
    btn.addEventListener('click',(e)=>{
      e.stopPropagation()
      const idx=parseInt(btn.dataset.idx)
      const song=state.searchResults[idx]
      if(state.nowPlaying&&!state.isLocalPlay&&state.nowPlaying.id===song.id){
        togglePlay()
      }else{
        playSearch(idx)
      }
    })
  })
}

function highlightSearch(fn){
  $('search-results').querySelectorAll('.search-card').forEach(c=>{
    const idx=parseInt(c.dataset.idx)
    c.classList.toggle('playing',fn(idx))
  })
}

// ===== 播放控制 =====
function togglePlay(){
  if(audio.paused){
    audio.play()
    $('btn-play').textContent='⏸'
    state.isPlaying=true
  }else{
    audio.pause()
    $('btn-play').textContent='▶'
    state.isPlaying=false
  }
}

$('btn-play').addEventListener('click',togglePlay)

$('btn-prev').addEventListener('click',()=>{
  if(state.playQueue.length===0) return
  state.queueIndex=(state.queueIndex-1+state.playQueue.length)%state.playQueue.length
  playCurrent()
})

$('btn-next').addEventListener('click',()=>{
  if(state.playQueue.length===0) return
  nextTrack()
})

function nextTrack(){
  if(state.playMode===2){ // 单曲循环
    playCurrent()
    return
  }
  let nextIdx
  if(state.playMode===1){ // 随机
    nextIdx=Math.floor(Math.random()*state.playQueue.length)
  }else{ // 顺序
    nextIdx=(state.queueIndex+1)%state.playQueue.length
  }
  state.queueIndex=nextIdx
  playCurrent()
}

function playCurrent(){
  const song=state.playQueue[state.queueIndex]
  if(!song) return
  state.nowPlaying=song
  if(state.isLocalPlay) playLocal(song)
  else if(song.id) playStream(song)
  else playLocal(song)
}

// ===== 播放模式 =====
$('btn-mode').addEventListener('click',()=>{
  state.playMode=(state.playMode+1)%3
  $('btn-mode').textContent=MODE_ICONS[state.playMode]
  $('btn-mode').title=MODE_LABELS[state.playMode]
})

// ===== 进度条 =====
audio.addEventListener('timeupdate',()=>{
  if(audio.duration){
    $('progress-fill').style.width=(audio.currentTime/audio.duration*100)+'%'
  }
})
audio.addEventListener('ended',()=>{
  $('btn-play').textContent='▶'
  state.isPlaying=false
  setTimeout(()=>nextTrack(),300)
})
audio.addEventListener('error',()=>{
  $('now-name').textContent='播放失败'
  $('btn-play').textContent='▶'
  state.isPlaying=false
})

// ===== 键盘 =====
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return
  if(e.code==='Space'){e.preventDefault();$('btn-play').click()}
  if(e.code==='ArrowLeft')$('btn-prev').click()
  if(e.code==='ArrowRight')$('btn-next').click()
})

// ===== 初始化 =====
$('btn-refresh').addEventListener('click',()=>{
  if(state.tab==='library') loadLibrary()
  else doSearch($('search-input').value.trim())
})
loadLibrary()
// 默认搜周杰伦
setTimeout(()=>{doSearch('周杰伦')},500)

// ===== 删除歌曲API =====
// 在 server.js 中添加删除路由
</script>
</body>
